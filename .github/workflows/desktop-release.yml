name: Desktop installer

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Bundle tosu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo tosuapp/tosu --pattern 'tosu-windows-*.zip' --output tosu.zip
          Expand-Archive -LiteralPath tosu.zip -DestinationPath vendor/tosu -Force
          gh api repos/tosuapp/tosu/license -H 'Accept: application/vnd.github.raw' > vendor/tosu/LICENSE-tosu.txt
          Remove-Item tosu.zip
          if (-not (Get-ChildItem vendor/tosu -Recurse -Filter 'tosu*.exe')) { throw 'tosu.exe missing from the tosu download' }

      - run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: duosu build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: desktop/release/duosu-Setup.exe
          make_latest: true
